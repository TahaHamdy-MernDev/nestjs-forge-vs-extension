name: Bug report
description: Create a report to help us improve Nest Forge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: version
    attributes:
      label: Nest Forge Version
      placeholder: e.g. 0.4.2
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code / IDE Version
      placeholder: e.g. 1.95.0 / Antigravity IDE
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open Command Palette
        2. Run 'NestJS: New Feature'
        3. Fill in '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
