<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e0234e" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#e0234e" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#glow)"/>

  <!-- Subtle Modular Grid Dots -->
  <circle cx="48" cy="48" r="1.5" fill="#3f3f46" />
  <circle cx="68" cy="48" r="1.5" fill="#3f3f46" />
  <circle cx="48" cy="68" r="1.5" fill="#3f3f46" />
  <circle cx="208" cy="48" r="1.5" fill="#3f3f46" />
  <circle cx="188" cy="48" r="1.5" fill="#3f3f46" />
  <circle cx="208" cy="68" r="1.5" fill="#3f3f46" />
  <circle cx="48" cy="208" r="1.5" fill="#3f3f46" />
  <circle cx="208" cy="208" r="1.5" fill="#3f3f46" />

  <!-- Center Anvil & Forge Motif -->
  <g filter="url(#shadow)" transform="translate(18, 16)">
    <!-- Base Plate -->
    <rect x="36" y="172" width="148" height="12" rx="6" fill="#3f3f46" />
    
    <!-- Anvil Waist -->
    <path d="M68 172 C68 150 82 142 84 136 L136 136 C138 142 152 150 152 172 Z" fill="#27272a" stroke="#52525b" stroke-width="2"/>

    <!-- Anvil Head / Body with NestJS Crimson Gradient -->
    <path d="M28 108 L188 108 C194 108 198 112 196 118 C190 134 176 142 156 142 L64 142 C40 142 24 126 24 114 C24 110 26 108 28 108 Z" fill="url(#forgeGrad)" stroke="#ff4d6d" stroke-width="2"/>

    <!-- Anvil Surface Highlight -->
    <path d="M34 112 L182 112" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Forge Spark / Nest Energy Bolt -->
    <g filter="url(#glowFilter)">
      <path d="M136 34 L106 82 L132 82 L102 124 L146 72 L120 72 Z" fill="url(#sparkGrad)"/>
    </g>

    <!-- Tiny Sparks -->
    <circle cx="84" cy="56" r="3" fill="#fbbf24"/>
    <circle cx="158" cy="48" r="2.5" fill="#f43f5e"/>
    <circle cx="168" cy="80" r="2" fill="#fef08a"/>
  </g>
</svg>